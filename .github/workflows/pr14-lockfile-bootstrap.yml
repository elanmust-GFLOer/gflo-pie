name: PR14 isolated lockfile regeneration (temporary)
on:
  push:
    branches: [security/hardhat-dependency-hardening-20261021]
    paths:
      - 'tests-v02/package.json'
      - '.github/workflows/pr14-lockfile-bootstrap.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests-v02
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Resolve npm lockfile and verify installation
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls tmp ws --all
          node - <<'NODE'
          const p=require('./package-lock.json').packages;
          if (p['node_modules/tmp']?.version!=='0.2.7') throw Error('tmp not locked to 0.2.7');
          if (p['node_modules/ws']?.version!=='8.21.1') throw Error('root ws not locked to 8.21.1');
          if (Object.entries(p).some(([key,value])=>(key.endsWith('/tmp')&&value.version==='0.0.33')||(key.endsWith('/ws')&&value.version==='8.17.1'))) throw Error('legacy vulnerable instance');
          NODE
          npm run compile
          npm test -- --no-compile
          sha256sum package.json package-lock.json
      - name: Report independent npm audit without hiding findings
        run: |
          set +e
          set -uo pipefail
          npm audit --json > /tmp/pr14-npm-audit.json
          audit_status=$?
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/pr14-npm-audit.json','utf8'));
          const list=Object.entries(report.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==='string'?x:x.title),fixAvailable:v.fixAvailable}));
          console.log('GFLO_PR14_AUDIT '+JSON.stringify({metadata:report.metadata?.vulnerabilities??null,vulnerabilities:list,status:Number(process.env.MISSING_STATUS||0)}));
          NODE
          echo "npm_audit_exit_code=$audit_status"
          exit 0
      - name: Commit npm-generated lockfile to bootstrap branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$BRANCH" = 'security/hardhat-dependency-hardening-20261021'
          test "$REPOSITORY" = 'elanmust-GFLOer/gflo-pie'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && { echo 'No lock changes'; exit 0; }
          git commit -m 'build(deps): npm-resolved patched Hardhat lockfile'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/security/hardhat-dependency-hardening-20261021
