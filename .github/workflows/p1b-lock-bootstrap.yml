name: P1B dependency override lock bootstrap (NON-ACCEPTANCE)
on:
  push:
    branches:
      - security/verified-contribution-gate-20261020
    paths:
      - '.github/workflows/p1b-lock-bootstrap.yml'
permissions:
  contents: read
jobs:
  generate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests-redteam5b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Resolve two advisory-scoped overrides (candidate only)
        run: |
          set -euo pipefail
          npm pkg set 'overrides.tmp=0.2.7' 'overrides.ws=8.21.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const p=require('./package.json'),l=require('./package-lock.json');
          if(p.overrides.tmp!=='0.2.7'||p.overrides.ws!=='8.21.0')throw Error('Unexpected overrides');
          if(l.packages['node_modules/tmp']?.version!=='0.2.7'||l.packages['node_modules/ws']?.version!=='8.21.0')throw Error('Override mismatch');
          console.log('P1B_CANDIDATE_RESOLVED tmp@'+l.packages['node_modules/tmp'].version+' ws@'+l.packages['node_modules/ws'].version);
          NODE
          sha256sum package.json package-lock.json
      - name: Print exact candidate metadata (public npm dependency metadata only)
        run: |
          echo P1B_PACKAGE_JSON_BASE64_BEGIN
          base64 -w0 package.json
          echo
          echo P1B_PACKAGE_JSON_BASE64_END
          echo P1B_LOCK_JSON_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo P1B_LOCK_JSON_BASE64_END
      - name: Upload candidate files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1b-candidate-lock
          path: |
            tests-redteam5b/package.json
            tests-redteam5b/package-lock.json
          if-no-files-found: error
          retention-days: 14
