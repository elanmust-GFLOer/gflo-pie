name: PIE v0.2 Genesis and Path tests
on:
  push:
    branches: [feature/pie-core-v0.2]
  pull_request:
    paths:
      - 'contracts/**'
      - 'tests-v02/**'
      - '.github/workflows/pie-v02-tests.yml'
  workflow_dispatch:
jobs:
  genesis-path:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-v02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Solidity
        run: npm run compile
      - name: Run Genesis and Path State Machine tests
        run: npm test
