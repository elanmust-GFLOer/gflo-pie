name: GFLO Sepolia Legacy PIE Read-only Audit

on:
  push:
    branches:
      - audit/sepolia-legacy-pie-readonly
    paths:
      - 'tests-v02/audit/**'
      - '.github/workflows/sepolia-legacy-pie-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  legacy-pie-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tests-v02
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Read original audit artifact and expose verifiable evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/elanmust-GFLOer/gflo-pie/actions/artifacts/12273190322/zip > prior-audit.zip
          python3 - <<'PY'
          import hashlib, io, pathlib, zipfile
          data = pathlib.Path('prior-audit.zip').read_bytes()
          expected = '3b42cb13ec1f6e44b938a7c0fe7ca32f4768aee7f3ca8a1d44f94035fd721c3c'
          assert hashlib.sha256(data).hexdigest() == expected, 'Original artifact ZIP digest mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in ('audit-output/audit.json', 'audit-output/audit.md', 'audit-output/sha256.txt'):
                  print('ORIGINAL_EVIDENCE_BEGIN ' + name)
                  print(z.read(name).decode('utf-8'))
                  print('ORIGINAL_EVIDENCE_END ' + name)
          PY
      - name: Install frozen read-only runtime dependencies
        run: |
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Audit live Sepolia state without signing or sending transactions
        run: |
          set -o pipefail
          node audit/sepolia-legacy-pie-readonly.cjs 2>&1 | tee audit-run.log
      - name: Expose current audit evidence for review
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib
          for name in ('audit.json', 'audit.md', 'sha256.txt'):
              p = pathlib.Path('audit-output') / name
              if p.exists():
                  print('CURRENT_EVIDENCE_BEGIN ' + name)
                  print(p.read_text())
                  print('CURRENT_EVIDENCE_END ' + name)
          PY
      - name: Upload read-only evidence even if inconclusive
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gflo-sepolia-legacy-pie-readonly-evidence
          path: |
            tests-v02/audit-output/
            tests-v02/audit-run.log
          if-no-files-found: error
          retention-days: 90

      - name: Download and verify the actual uploaded artifact
        if: always() && steps.evidence.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          AUDIT_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          gh api "repos/elanmust-GFLOer/gflo-pie/actions/artifacts/$AUDIT_ARTIFACT_ID/zip" > uploaded-audit.zip
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile
          data = pathlib.Path('uploaded-audit.zip').read_bytes()
          actual = hashlib.sha256(data).hexdigest()
          assert actual == os.environ['AUDIT_ARTIFACT_DIGEST'], 'Uploaded ZIP digest mismatch'
          print('UPLOADED_ARTIFACT_ID=' + os.environ['AUDIT_ARTIFACT_ID'])
          print('UPLOADED_ARTIFACT_SHA256=' + actual)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              manifest = z.read('audit-output/sha256.txt').decode()
              for line in manifest.splitlines():
                  digest, name = line.split()
                  body = z.read('audit-output/' + name)
                  assert hashlib.sha256(body).hexdigest() == digest, 'Member digest mismatch: ' + name
                  assert body == (pathlib.Path('audit-output') / name).read_bytes(), 'Uploaded/local evidence differs'
                  print('UPLOADED_EVIDENCE_BEGIN ' + name)
                  print(body.decode())
                  print('UPLOADED_EVIDENCE_END ' + name)
              audit = json.loads(z.read('audit-output/audit.json'))
              assert audit['commit'] == os.environ['GITHUB_SHA'], 'Artifact commit differs'
          print('UPLOADED_ARTIFACT_VERIFICATION=PASS')
          PY
