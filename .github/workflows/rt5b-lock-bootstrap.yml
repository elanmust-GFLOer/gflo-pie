name: RT5B dependency lock bootstrap (non-acceptance)
on:
  push:
    branches: [fix/rt5-15-policy-pause-failclosed-20261020]
    paths:
      - 'tests-redteam5b/**'
      - '.github/workflows/rt5b-lock-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests-redteam5b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Generate lockfile for review — NOT acceptance
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          sha256sum package-lock.json
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt5b-candidate-lock
          path: tests-redteam5b/package-lock.json
          if-no-files-found: error
          retention-days: 30
